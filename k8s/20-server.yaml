# bh-server: 唯一后端服务（端口 8788）
# 家庭 / AI / 知识库三个模块同进程（services/Baihua.Server，AssemblyName bh-server，dll bh-server.dll）
# 合并前这里是三个独立后端（家庭 / 知识库 / AI 各一个 Deployment + Service）
#
# OpenVINO 推理在 bh-openvino 独立服务；bh-server 通过 K8s Service DNS
# (http://bh-openvino:8000) 调用 OVMS，因此本 Pod 不需要 Intel GPU 资源。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-server
  namespace: baihua
  labels:
    app: bh-server
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-server
  template:
    metadata:
      labels:
        app: bh-server
    spec:
      # 启动顺序：k8s 不保证 Pod 之间的依赖顺序，用 initContainer 等数据库可用再启动后端。
      # （后端自身也有启动期重试兜底，见 services/Baihua.Server/Program.cs 的数据库初始化重试逻辑）
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h bh-postgres -p 5432 -U baihua -d baihua; do echo "waiting for postgres..."; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: bh-server
          image: bh-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
              name: http
          envFrom:
            - configMapRef:
                name: baihua-config
            - secretRef:
                name: baihua-secret
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8788"
            - name: BAIHUA_SKIP_MUTEX
              value: "true"
            # 服务器互联（百花↔百花 互发消息）：入口地址自动探测（下行 API 注入节点 IP，广播/回发用）。
            # 如入口不在 80 或想用域名，可显式覆盖 BAIHUA_SERVER_PUBLIC_BASE_URL
            - name: BAIHUA_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # 管理 API 访问控制：放行集群网段 + 本机所在局域网。
            # 关键点：必须同时声明 BAIHUA_TRUSTED_PROXY_NETS（见下），否则服务端看到的来源 IP
            # 永远是 Traefik 的 Pod IP（10.42.x.x），一切"按客户端 IP"的策略都会失真：
            #  - 管理 API 会因 Pod IP 落在放行网段而对整个局域网事实上开放（且看不出真实来源）；
            #  - /mg/register-device 的 5 次/小时配对限流会被所有手机共用一个桶（多设备家庭易 429）；
            #  - 设备记录/审计日志里的 ipAddress 全是 Pod IP。
            # 采信 XFF 后，来源 IP 变为真实局域网地址，因此这里必须显式列出局域网网段。
            # 换网段（路由器改了 192.168.x）时记得同步改这里，否则管理 API/插件会 403。
            - name: BAIHUA_ADMIN_ALLOWED_NETS
              value: "10.0.0.0/8,192.168.3.0/24"
            # 受信任的反向代理网段：只有来自这些网段的 X-Forwarded-For 才被采信
            # （k3s 默认 Pod 网段 10.42.0.0/16；局域网客户端不在其中，无法伪造来源 IP）
            - name: BAIHUA_TRUSTED_PROXY_NETS
              value: "10.42.0.0/16"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: vaults
              mountPath: /vaults
            # 同一份笔记再挂到 BAIHUA_HOME/vaults：应用的「知识库根目录」恒为 $BAIHUA_HOME/vaults
            # （BaihuaPaths.Vaults），数据库里记录的路径也是 /app/data/vaults/... 。
            # 早期这里是数据卷里的一个符号链接（-> /mnt/c/...），但那个目标在容器命名空间里不存在，
            # 于是所有知识库路径都解析失败（健康检查报「知识库路径不存在」）。直接挂真实目录最稳。
            - name: vaults
              mountPath: /app/data/vaults
            # OpenVINO 模型目录（只读挂载，用于扫描可用模型列表）
            - name: models
              mountPath: /opt/baihua/models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8788
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8788
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            # 合并前的额度：family 2Gi + ai 2Gi + vault 512Mi 三个进程；现在同一个进程承载三模块，
            # 因此上限取三者之和量级（4Gi），避免合并后仍按 2Gi 限额被 OOMKill。
            limits:
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-data-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: baihua-logs-pvc
        - name: vaults
          persistentVolumeClaim:
            claimName: baihua-vaults-pvc
        - name: models
          persistentVolumeClaim:
            claimName: baihua-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-server
  namespace: baihua
  labels:
    app: bh-server
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-server
  # 不再固定 clusterIP：合并前固定 ClusterIP 只是为了让兄弟 Pod（及宿主机 DSH）按 IP 找到
  # family/vault/ai 三个后端；现在只有一个后端，统一用 Service DNS（bh-server:8788）。
  ports:
    - name: http
      port: 8788
      targetPort: 8788
      protocol: TCP
