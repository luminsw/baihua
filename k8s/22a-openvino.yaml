# bh-openvino: OpenVINO Model Server（Intel OVMS）
# 提供 OpenAI 兼容推理 API：/v1/chat/completions（LLM+视觉）、/v1/models（状态）
# 模型仓库 = baihua-models-pvc（/models，预下载的 OpenVINO IR 模型目录）：
#   qwen2.5-vl-7b    /models/Qwen2.5-VL-7B-Instruct-int4-ov   （视觉，CPU/GPU）
#   本机当前仅有上述模型；qwen2.5 文本 / bge 嵌入目录缺失，不应注册到 OVMS。
# 说明：
#   - 这是唯一需要 Intel GPU 的服务 —— /dev/dri（真机）/ /dev/dxg（WSL2）由 intel-gpu-plugin 注入
#   - 用 OVMS 单模型 GenAI 模式直接加载目录根部文件；config_path 的模型仓库需要数字版本子目录
#   - 该模式一次只加载一个模型；新增模型需拆分 Deployment 或整理为带版本目录的 model_config_list
#   - AI/Family 通过 K8s Service DNS http://bh-openvino:8000 调用（OpenVinoOms__BaseUrl / OPENVINO_LLM_URL）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-openvino
  namespace: baihua
  labels:
    app: bh-openvino
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-openvino
  template:
    metadata:
      labels:
        app: bh-openvino
    spec:
      # 限制调度到有 Intel GPU 的节点
      # nodeSelector:
      #   intel-gpu: "true"
      containers:
        - name: bh-openvino
          image: bh-openvino:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: rest
            - containerPort: 9000
              name: grpc
          args:
            - --model_path=/models/Qwen2.5-VL-7B-Instruct-int4-ov
            - --model_name=qwen2.5-vl-7b
            - --task=text_generation
            - --rest_port=8000
            - --port=9000
            - --log_level=INFO
            - --cache_dir=/cache
          env:
            # 备用：若改用 OVMS --pull 下载模型，走国内 HF 镜像
            - name: HF_ENDPOINT
              value: "https://hf-mirror.com"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: cache
              mountPath: /cache
            # Intel GPU 设备节点（由 intel-gpu-plugin 自动注入）
            - name: dri
              mountPath: /dev/dri
            # WSL2 GPU 半虚拟化设备（NEO 驱动走此设备）
            - name: dxg
              mountPath: /dev/dxg
            # 微软 GPU-PV 用户态库 + Intel WSL compute helper（NEO 驱动访问 /dev/dxg 必需）
            - name: wsl-lib
              mountPath: /usr/lib/wsl
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v1/models/qwen2.5-vl-7b
              port: 8000
            # 等待指定模型完成加载，避免 /v1/models 在空模型列表时也报告 Ready
            # 冷启动首次加载 7B 模型编译较慢，放宽等待窗口
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          resources:
            # 注意：limits.memory 必须 ≤ 节点可分配内存，否则 Pod 永远 Pending
            # （本机节点 15.4Gi，原先写 16Gi → 调度不进去；模型跑在 GPU 上，宿主内存只需留给加载缓冲）
            limits:
              memory: 12Gi
            requests:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            # WSL2 下访问 /dev/dxg（GPU-PV 设备）需要特权；真机 /dev/dri 不需要但无妨
            privileged: true
            allowPrivilegeEscalation: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: baihua-models-pvc
        - name: cache
          emptyDir: {}
        # 【本机 WSL 专用，按需启用】模型目录里有指向 modelscope 缓存的软链时，必须把缓存也挂进来，
        # 否则容器内软链悬空、OVMS 找不到模型。启用方式：取消下面注释 + 在 volumeMounts 里同样加上
        #   - name: modelscope-cache
        #     mountPath: /mnt/c/Users/lumin/.cache/modelscope
        #     readOnly: true
        # - name: modelscope-cache
        #   hostPath:
        #     path: /mnt/c/Users/lumin/.cache/modelscope
        #     type: Directory
        # /dev/dri 由 Intel GPU Device Plugin 自动注入（真机场景）
        - name: dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
        # /dev/dxg = WSL2 GPU 半虚拟化设备（WSL2 场景，Intel NEO 驱动走此设备）
        - name: dxg
          hostPath:
            path: /dev/dxg
        # 微软 GPU-PV 用户态库 + Intel WSL compute helper（WSL2 场景，NEO 驱动依赖）
        - name: wsl-lib
          hostPath:
            path: /usr/lib/wsl
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: bh-openvino
  namespace: baihua
  labels:
    app: bh-openvino
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-openvino
  ports:
    - name: rest
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP
---
