# 百花服务敏感配置模板
# 部署前必须填入实际值！
# ADMIN_PASSWORD_HASH：合并后管理员密码经管理面板/管理 API 写入服务器，此处为历史遗留键（可留空）
# 生成 MOBILE_AUTH_SECRET: openssl rand -hex 32
# 生成 BAIHUA_ENCRYPTION_KEY: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: baihua-secret
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
type: Opaque
stringData:
  # 管理员密码哈希（BCrypt）
  ADMIN_PASSWORD_HASH: ""

  # 移动端 HMAC 签名密钥
  MobileAuth__SharedSecret: ""

  # 加密密钥（用于加密 API Key 等敏感数据）
  BAIHUA_ENCRYPTION_KEY: ""

  # 管理员 IP 白名单（逗号分隔，留空=不限）
  ADMIN_IP_WHITELIST: ""

  # 跨机算力/绘图/AI shim 鉴权 token（API 名 BAIHUA_AI_EXTERNAL_TOKEN，注入 bh-server）。
  # 设置后：绘图网关 /mg/pool/v1/draw/*、AI shim /mg/ai/v1/*、算力池能力 对「回环 + 管理允许网段(10.0.0.0/8)」免鉴权，
  #   其余来源（跨机）需带该 token（X-Server-Token / Authorization: Bearer / ?token=）。留空 = 局域网信任（免鉴权）。
  # 本机 DSH 属 10.0.0.0/8 → 仍免鉴权；仅远端节点需要 token，正好实现「本机零配置、跨机算力互信」。
  # 生成：openssl rand -hex 32
  BAIHUA_AI_EXTERNAL_TOKEN: ""
