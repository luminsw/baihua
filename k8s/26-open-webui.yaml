# bh-open-webui: Open WebUI（AI 对话前端）
# 宿主机浏览器经 iframe（Baihua.Web /open-webui 页）访问 http://localhost:8080
# Service 用 LoadBalancer 类型，k3s svclb 自动绑宿主 :8080（不走 Traefik，避免 SPA 路径前缀问题）
# 镜像为上游 ghcr.io/open-webui/open-webui:main，不由本仓库构建
# LLM 后端在 open-webui 设置页里配（云端 OpenAI 兼容端点，如 DeepSeek），不在此硬编码
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-openwebui-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/open-webui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-openwebui-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: baihua-openwebui-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-open-webui
  namespace: baihua
  labels:
    app: bh-open-webui
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-open-webui
  template:
    metadata:
      labels:
        app: bh-open-webui
    spec:
      containers:
        - name: bh-open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # 集群内 WebUI 经 iframe 嵌入，关闭 open-webui 自带的注册页
            # 首次使用需在 open-webui 内创建管理员账号，之后可按需放开
            - name: WEBUI_AUTH
              value: "true"
            # 禁用 Ollama（本环境无 Ollama，指向不存在的端口避免 open-webui 反重试）
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OLLAMA_BASE_URL
              value: "http://localhost:1"
            # OpenAI 兼容 API → 集群内 OVMS（qwen3-4b 对话 + qwen3-embedding-0.6b 嵌入）
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: "http://bh-openvino:8000/v1"
            - name: OPENAI_API_KEY
              value: "dummy"
            # embedding 走 OVMS 的 qwen3-embedding-0.6b，绕过 HuggingFace 下载（WSL 不通 HF）
            - name: RAG_EMBEDDING_ENGINE
              value: "openai"
            - name: RAG_OPENAI_EMBEDDING_MODEL
              value: "qwen3-embedding-0.6b"
            # 禁用 HuggingFace/sentence-transformers 网络请求（WSL 不通 HF，避免启动卡死）
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: SENTENCE_TRANSFORMERS_HOME
              value: "/app/backend/data/sentence_transformers"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-openwebui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-open-webui
  namespace: baihua
  labels:
    app: bh-open-webui
    app.kubernetes.io/part-of: baihua
spec:
  type: LoadBalancer
  selector:
    app: bh-open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP