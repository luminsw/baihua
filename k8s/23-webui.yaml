# bh-webui: Blazor Server Web 界面（端口 5177）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-webui
  namespace: baihua
  labels:
    app: bh-webui
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-webui
  template:
    metadata:
      labels:
        app: bh-webui
    spec:
      containers:
        - name: bh-webui
          image: bh-webui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5177
              name: http
          envFrom:
            - configMapRef:
                name: baihua-config
            - secretRef:
                name: baihua-secret
          # 后端地址只有一个：BaihuaServer__BaseUrl（ConfigMap 注入 http://bh-server:8788/）。
          # 合并前的 FamilyApi__BaseUrl / AiApi__BaseUrl / VaultApi__BaseUrl 三个键已删除。
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:5177"
            - name: WEBUI_CONFIG_DIR
              value: "/app/data"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: vaults
              mountPath: /vaults
          readinessProbe:
            httpGet:
              path: /
              port: 5177
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5177
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-data-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: baihua-logs-pvc
        - name: vaults
          persistentVolumeClaim:
            claimName: baihua-vaults-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-webui
  namespace: baihua
  labels:
    app: bh-webui
    app.kubernetes.io/part-of: baihua
spec:
  selector:
    app: bh-webui
  # 不再固定 clusterIP：统一用 Service DNS（集群内 bh-webui:5177，入口走 Traefik）。
  ports:
    - name: http
      port: 5177
      targetPort: 5177
      protocol: TCP
