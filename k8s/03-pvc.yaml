# 百花服务持久化存储
# 生产环境建议替换为 StorageClass 动态 provisioning
# 当前使用 hostPath + nodeSelector，适合单节点部署
---
# 数据存储（SQLite 数据库、配置文件）
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-data-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-data-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: baihua-data-pv
---
# 日志存储
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-logs-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-logs-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: baihua-logs-pv
---
# 知识库存储（Vaults 目录）
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-vaults-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /home/lumin/Vaults
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-vaults-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 50Gi
  volumeName: baihua-vaults-pv
---
# OpenVINO 模型存储（大模型文件，通常 5-20GB）
# 同时挂载到 bh-openvino (RW, 推理读取) 和 bh-server (RO, 模型扫描)
# 单节点 hostPath 可用 RWO；多节点需改为 NFS + RWX
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-models-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-models-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 50Gi
  volumeName: baihua-models-pv
