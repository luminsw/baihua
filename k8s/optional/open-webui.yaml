# bh-open-webui: Open WebUI（AI 对话前端）—— 可选，不进默认部署
#
# 为什么不在 k8s/ 主目录：镜像在上游 ghcr.io（压缩后约 1.5 GB），国内直连拉取很慢，
# 而它只是「AI 对话」这一个界面，不影响百花自身的 AI 功能。默认部署（bh deploy）刻意不 apply 它，
# 需要的人自行执行（几分钟到几十分钟，看网速）：
#
#   sudo k3s kubectl apply -f k8s/optional/open-webui.yaml
#   sudo k3s kubectl -n baihua rollout status deploy/bh-open-webui
#
# 装好后浏览器访问 http://<节点IP>:8080（Service 用 LoadBalancer，k3s svclb 绑宿主 :8080），
# 首次进入创建管理员账号。百花 WebUI 的 AI 对话页（/open-webui）按钮默认就指向这个地址。
#
# 注意：本清单不属于平台管理范围 —— bh backup/restore 不备份 baihua-openwebui-pv，
# bh doctor / bh status 也不检查它；不需要时 `kubectl -n baihua delete -f` 即可。
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-openwebui-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/open-webui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-openwebui-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: baihua-openwebui-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-open-webui
  namespace: baihua
  labels:
    app: bh-open-webui
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-open-webui
  template:
    metadata:
      labels:
        app: bh-open-webui
    spec:
      containers:
        - name: bh-open-webui
          # 境内拉取：南京大学镜像站（与 ghcr.io 同内容，版本可能略滞后）。
          # 网络好或要跟最新版时换成 ghcr.io/open-webui/open-webui:main
          image: ghcr.nju.edu.cn/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # 首次使用需在 open-webui 内创建管理员账号（第一个注册的用户即管理员）
            - name: WEBUI_AUTH
              value: "true"
            # 禁用 Ollama（本环境无 Ollama，指向不存在的端口避免 open-webui 反复重试）
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OLLAMA_BASE_URL
              value: "http://localhost:1"
            # 配置两个 OpenAI 连接：百花网关用于云端/算力池文本模型，OVMS 直连用于本机视觉模型。
            # OpenWebUI 在 Pod 内请求；bh-openvino 是集群内 Service，不需要暴露 8000 端口。
            # 百花网关目前只支持纯文本；OVMS 连接使用 /v3，支持已加载模型的视觉输入。
            # 独立音频/视频端点及 embedding 模型当前均未部署。
            - name: ENABLE_OPENAI_API
              value: "true"
            # 单连接兼容回退；当前 OpenWebUI 使用下面的多连接配置覆盖它。
            - name: OPENAI_API_BASE_URL
              value: "http://bh-server:8788/mg/ai/v1"
            - name: OPENAI_API_KEY
              value: "baihua"
            # 分号分隔，URL 与 API Key 按索引配对：[0] 百花网关；[1] OVMS（无需 API Key）。
            - name: OPENAI_API_BASE_URLS
              value: "http://bh-server:8788/mg/ai/v1;http://bh-openvino:8000/v3"
            - name: OPENAI_API_KEYS
              value: "baihua;"
            # 区分模型来源并避免 ID 冲突：网关为 baihua.<模型名>，OVMS 为 ovms.<模型名>。
            - name: OPENAI_API_CONFIGS
              value: '{"0":{"prefix_id":"baihua"},"1":{"prefix_id":"ovms"}}'
            # 当前没有部署 embedding 模型；需要文件 RAG 时，需另配支持 embeddings 的服务。
            - name: RAG_EMBEDDING_ENGINE
              value: "openai"
            - name: RAG_OPENAI_EMBEDDING_MODEL
              value: "qwen3-embedding-0.6b"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: SENTENCE_TRANSFORMERS_HOME
              value: "/app/backend/data/sentence_transformers"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-openwebui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-open-webui
  namespace: baihua
  labels:
    app: bh-open-webui
    app.kubernetes.io/part-of: baihua
spec:
  type: LoadBalancer
  selector:
    app: bh-open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
