# bh-open-webui: Open WebUI（AI 对话前端）—— 可选，不进默认部署
#
# 为什么不在 k8s/ 主目录：镜像在上游 ghcr.io（压缩后约 1.5 GB），国内直连拉取很慢，
# 而它只是「AI 对话」这一个界面，不影响百花自身的 AI 功能。默认部署（bh deploy）刻意不 apply 它，
# 需要的人自行执行（几分钟到几十分钟，看网速）：
#
#   sudo k3s kubectl apply -f k8s/optional/open-webui.yaml
#   sudo k3s kubectl -n baihua rollout status deploy/bh-open-webui
#
# 装好后浏览器访问 http://<节点IP>:8080（Service 用 LoadBalancer，k3s svclb 绑宿主 :8080），
# 首次进入创建管理员账号。百花 WebUI 的 AI 对话页（/open-webui）按钮默认就指向这个地址。
#
# 注意：本清单不属于平台管理范围 —— bh backup/restore 不备份 baihua-openwebui-pv，
# bh doctor / bh status 也不检查它；不需要时 `kubectl -n baihua delete -f` 即可。
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baihua-openwebui-pv
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/baihua/open-webui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baihua-openwebui-pvc
  namespace: baihua
  labels:
    app.kubernetes.io/part-of: baihua
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: baihua-openwebui-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-open-webui
  namespace: baihua
  labels:
    app: bh-open-webui
    app.kubernetes.io/part-of: baihua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-open-webui
  template:
    metadata:
      labels:
        app: bh-open-webui
    spec:
      containers:
        - name: bh-open-webui
          # 境内拉取：南京大学镜像站（与 ghcr.io 同内容，版本可能略滞后）。
          # 网络好或要跟最新版时换成 ghcr.io/open-webui/open-webui:main
          image: ghcr.nju.edu.cn/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # 首次使用需在 open-webui 内创建管理员账号（第一个注册的用户即管理员）
            - name: WEBUI_AUTH
              value: "true"
            # 禁用 Ollama（本环境无 Ollama，指向不存在的端口避免 open-webui 反复重试）
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OLLAMA_BASE_URL
              value: "http://localhost:1"
            # 模型走百花自己的 OpenAI 兼容网关（云端模型 + 本机 OVMS 都在里面），
            # 等价于在「管理员设置 → 连接」里手填 http://<节点IP>/mg/ai/v1。
            # 当前仅支持纯文本聊天；多模态聊天内容返回 400，独立媒体/embedding API 未实现。
            # bh-server 的 /mg/ai/v1 在局域网内默认免鉴权；若管理员配置了
            # BAIHUA_AI_EXTERNAL_TOKEN，下面的 OPENAI_API_KEY 必须改成同一值。
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: "http://bh-server:8788/mg/ai/v1"
            - name: OPENAI_API_KEY
              value: "baihua"
            # RAG_OPENAI_API_BASE_URL 默认继承 OPENAI_API_BASE_URL；百花网关没有 /embeddings，
            # 因此文件 RAG 需另配 RAG_OPENAI_API_BASE_URL / RAG_OPENAI_API_KEY 指向可用的 embedding 服务。
            - name: RAG_EMBEDDING_ENGINE
              value: "openai"
            - name: RAG_OPENAI_EMBEDDING_MODEL
              value: "qwen3-embedding-0.6b"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: SENTENCE_TRANSFORMERS_HOME
              value: "/app/backend/data/sentence_transformers"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baihua-openwebui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bh-open-webui
  namespace: baihua
  labels:
    app: bh-open-webui
    app.kubernetes.io/part-of: baihua
spec:
  type: LoadBalancer
  selector:
    app: bh-open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
