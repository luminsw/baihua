# ============================================================================
# 百花 · Windows Docker 形态（Docker Desktop + Linux 容器）
#
# 与 docker-compose.yml（Linux 服务器：host 网络 + /opt/baihua 路径）分开维护：
#   - Windows 没有 Linux 的 host 网络语义 → bridge + 端口映射；
#   - Windows 没有 /opt 目录 → 数据/日志走 BAIHUA_DATA_DIR / BAIHUA_LOG_DIR；
#   - 宿主机 OVMS（Windows :8000 进程或服务）容器内经 host.docker.internal 访问；
#   - PostgreSQL 用命名卷（Windows 绑定挂载会让 postgres 数据目录权限出错），
#     只绑回环 127.0.0.1:5433，避开宿主机可能已在 5432 跑的 PostgreSQL。
#
# 入口：bh docker <build|start|stop|restart|status|logs|update|...>
#       （内部固定带 --env-file docker/.env.windows，由 bh 首次运行时生成）
# 手动等价：
#   docker compose --env-file docker/.env.windows -f docker/docker-compose.windows.yml up -d
# ============================================================================

name: baihua-win

services:
  postgres:
    image: postgres:18-alpine
    container_name: bh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-baihua}
      POSTGRES_USER: ${PG_USER:-baihua}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 未设置：先运行 bh docker env 生成 docker/.env.windows}
    ports:
      - "127.0.0.1:${PG_DOCKER_PORT:-5433}:5432"
    volumes:
      - bh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-baihua} -d ${PG_DATABASE:-baihua}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [baihua]

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
    image: bh-server:latest
    container_name: bh-server
    restart: unless-stopped
    ports:
      - "${BAIHUA_SERVER_PORT:-8788}:8788"
    extra_hosts:
      # 容器 → 宿主机（OVMS :8000 / 其它本机服务）；Docker Desktop 自带同名解析，这行兼容 Linux 引擎
      - "host.docker.internal:host-gateway"
    environment:
      - BAIHUA_HOME=/app/data
      - BAIHUA_SKIP_MUTEX=true
      - ASPNETCORE_URLS=http://0.0.0.0:8788
      - PG_HOST=postgres
      - PG_USER=${PG_USER:-baihua}
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD 未设置：先运行 bh docker env 生成 docker/.env.windows}
      - PG_DATABASE=${PG_DATABASE:-baihua}
      - BAIHUA_VAULT_ROOT=/vaults
      - BAIHUA_ENCRYPTION_KEY=${BAIHUA_ENCRYPTION_KEY:-}
      - MobileAuth__SharedSecret=${MOBILE_AUTH_SECRET:-}
      # 管理 API 默认只允许 loopback；bridge 网络里 webui 的源地址是 172.x，必须显式放行
      - BAIHUA_ADMIN_ALLOWED_NETS=172.16.0.0/12
      # 本机 OVMS：容器内 127.0.0.1 是容器自己，必须走 host.docker.internal
      - OPENVINO_LLM_URL=http://host.docker.internal:8000
      - OpenVinoOms__BaseUrl=http://host.docker.internal:8000
      - OpenObserve__Enabled=${OPENOBSERVE_ENABLED:-false}
      - OpenObserve__WebUrl=http://openobserve:5080/
      - OpenObserve__Password=${OPENOBSERVE_PASSWORD:-}
    volumes:
      - ${BAIHUA_DATA_DIR:?BAIHUA_DATA_DIR 未设置：先运行 bh docker env}:/app/data
      - ${BAIHUA_LOG_DIR:?BAIHUA_LOG_DIR 未设置：先运行 bh docker env}:/app/logs
      - ${VAULTS_DIR:?VAULTS_DIR 未设置（知识库根目录）：先运行 bh docker env}:/vaults
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [baihua]

  webui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webui
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
    image: bh-webui:latest
    container_name: bh-webui
    restart: unless-stopped
    ports:
      - "${BAIHUA_WEBUI_PORT:-5177}:5177"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEBUI_CONFIG_DIR=/app/data
      - ASPNETCORE_URLS=http://0.0.0.0:5177
      # 唯一后端地址：bridge 内用服务名
      - BaihuaServer__BaseUrl=http://server:8788/
      - ADMIN_IP_WHITELIST=${ADMIN_IP_WHITELIST:-172.16.0.0/12}
      - OpenObserve__Enabled=${OPENOBSERVE_ENABLED:-false}
      - OpenObserve__WebUrl=http://openobserve:5080/
      - OpenObserve__Password=${OPENOBSERVE_PASSWORD:-}
    volumes:
      - ${BAIHUA_DATA_DIR}:/app/data
      - ${BAIHUA_LOG_DIR}:/app/logs
      - ${VAULTS_DIR}:/vaults
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5177/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [baihua]

volumes:
  # PostgreSQL 数据（命名卷：Windows 绑定挂载会破坏 postgres 数据目录权限）
  bh-pgdata:
    name: baihua-win-pgdata

networks:
  baihua:
    name: baihua-win-net
    driver: bridge
