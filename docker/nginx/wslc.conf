# 百花 wslc 容器形态的 Nginx（bridge 网络：上游用容器名）
# 由 bh wslc 挂载为 /etc/nginx/conf.d/default.conf
# 与 docker/nginx/default.conf.template 的区别：上游是 bh-server / bh-webui，不是 127.0.0.1。

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- WebUI 静态资源 ----------
    location ^~ /_framework/ {
        proxy_pass http://bh-webui:5177/_framework/;
        include /etc/nginx/server-proxy-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /css/ {
        proxy_pass http://bh-webui:5177/css/;
        include /etc/nginx/server-proxy-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- WebUI SignalR / Blazor WebSocket ----------
    location /hubs/status {
        proxy_pass http://bh-webui:5177/hubs/status;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
    location /_blazor {
        proxy_pass http://bh-webui:5177/_blazor;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # ---------- 后端（Baihua.Server）----------
    location /mg/ {
        proxy_pass http://bh-server:8788/mg/;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 600;
    }
    location = /pair { proxy_pass http://bh-server:8788/pair; include /etc/nginx/server-proxy-headers.conf; }
    location = /pair/code { proxy_pass http://bh-server:8788/pair/code; include /etc/nginx/server-proxy-headers.conf; }
    location = /vault/pair { proxy_pass http://bh-server:8788/vault/pair; include /etc/nginx/server-proxy-headers.conf; }
    location /ws/devices {
        proxy_pass http://bh-server:8788/ws/devices;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://bh-server:8788/api/;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }
    location /mcp {
        proxy_pass http://bh-server:8788/mcp;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }
    location /dsh-bridge/ {
        proxy_pass http://bh-server:8788/dsh-bridge/;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://bh-server:8788/health;
        include /etc/nginx/server-proxy-headers.conf;
    }
    location /hubs/ {
        proxy_pass http://bh-server:8788/hubs/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # ---------- 其余 → WebUI ----------
    location / {
        proxy_pass http://bh-webui:5177/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
