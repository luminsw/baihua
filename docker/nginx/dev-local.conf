# 百花开发环境 Nginx 配置（Docker Desktop for Windows）
# 宿主机服务通过 192.168.3.9 访问（不是 127.0.0.1）
# 启动: docker run -d --name baihua-nginx -p 80:80 \
#   --add-host 192.168.3.9:host-gateway \
#   -v <this-file>:/etc/nginx/conf.d/default.conf:ro \
#   -v <server-proxy-headers.conf>:/etc/nginx/server-proxy-headers.conf:ro \
#   nginx:1.27-alpine

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Blazor 静态资源（带 hash → 1 年强缓存）
    location ^~ /_framework/ {
        proxy_pass http://192.168.3.9:5177/_framework/;
        include /etc/nginx/server-proxy-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /css/ {
        proxy_pass http://192.168.3.9:5177/css/;
        include /etc/nginx/server-proxy-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Blazor SignalR Hub（WebSocket）
    location /hubs/status {
        proxy_pass http://192.168.3.9:5177/hubs/status;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # 移动端 API（Baihua.Server 统一鉴权入口）
    location /mg/ {
        proxy_pass http://192.168.3.9:8788/mg/;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 600;
    }

    # 配对码/配对页
    location = /pair {
        proxy_pass http://192.168.3.9:8788/pair;
        include /etc/nginx/server-proxy-headers.conf;
    }
    location = /pair/code {
        proxy_pass http://192.168.3.9:8788/pair/code;
        include /etc/nginx/server-proxy-headers.conf;
    }
    location = /vault/pair {
        proxy_pass http://192.168.3.9:8788/vault/pair;
        include /etc/nginx/server-proxy-headers.conf;
    }

    # 移动端设备推送 WebSocket
    location /ws/devices {
        proxy_pass http://192.168.3.9:8788/ws/devices;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # 管理侧 API + AI chat（SSE 关缓冲）
    location /api/ {
        proxy_pass http://192.168.3.9:8788/api/;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    # SignalR hubs（task-progress/devices/server-messages）
    location /hubs/ {
        proxy_pass http://192.168.3.9:8788/hubs/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # WebUI 根路径（最后）
    location / {
        proxy_pass http://192.168.3.9:5177/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        include /etc/nginx/server-proxy-headers.conf;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
